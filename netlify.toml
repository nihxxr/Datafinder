[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 3000
  targetPort = 5173
  framework = "#custom"

[functions]
  node_bundler = "esbuild"

# SPA catch-all only applies in production (deployed builds)
[context.production]
  [[context.production.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[context.deploy-preview]
  [[context.deploy-preview.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
